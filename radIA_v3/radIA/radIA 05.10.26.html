function addExam(){const f=$('fl').files[0],p=E($('pn').value.trim()),c=dg($('pc').value);if(!p||!c||!f)return toast('Informe o nome, o CPF e o arquivo do exame.');if(f.size>10*2**20)return toast('Arquivo acima de 10 MB.');

 const sd=Math.sqrt(q/(w*h)),th=m+.25*sd,ax=h>=w,A=ax?h:w,B=ax?w:h,P=(a,b)=>g[ax?a*w+b:b*w+a],cn=[],en=[];
 for(let a=0;a<A;a++){let n=0,s=0;for(let b=0;b<B-1;b++)if(P(a,b)>th){n++;if(a<A-1)s+=Math.abs(P(a,b)-P(a+1,b))+Math.abs(P(a,b)-P(a,b+1))}cn.push(n);en.push(s)}
 let a0=cn.findIndex(n=>n>=B*.04),a1=A-1-[...cn].reverse().findIndex(n=>n>=B*.04);if(a0<0||a1<=a0){a0=0;a1=A-1}
 const Lg=a1-a0,fr=/proximal|colo|cabeça|base|olécrano/.test(f[0])?.2:/distal|inferior|maléolo|calcâneo/.test(f[0])?.8:.5,t0=a0+Lg*fr,r=Math.max(2,Lg*.12);
 let bs=-1,ba=Math.round(t0);for(let a=Math.max(a0,Math.round(t0-r));a<=Math.min(a1,Math.round(t0+r));a++){const v=(en[a-1]||0)+en[a]+(en[a+1]||0);if(v>bs){bs=v;ba=a}}
 let sb=0,sn=0;for(let a=Math.max(0,ba-2);a<=Math.min(A-1,ba+2);a++)for(let b=0;b<B;b++)if(P(a,b)>th){sb+=b;sn++}
 const bc=sn?sb/sn:B/2,bw=sn?sn/5:B*.3,ha=Math.max(Lg*.22,A*.14),hb=Math.min(Math.max(bw*1.6,B*.18),B*.6),u=(v,z)=>Math.max(0,Math.min(100-z,v-z/2)),pa=ba/A*100,pb=bc/B*100,sa=ha/A*100,sp=hb/B*100;
 const gm=new Float32Array(w*h);for(let y=0;y<h-1;y++)for(let k=0;k<w-1;k++){const i=y*w+k;gm[i]=g[i]>th*.9?Math.abs(g[i]-g[i+1])+Math.abs(g[i]-g[i+w]):0}

 for(let y=0;y<h;y++)for(let k=0;k<w;k++){const i=y*w+k,v=Math.min(1,(gm[i]/mx)**.7*(.3+.9*Math.exp(-((k/w*100-cx)**2+(y/h*100-cy)**2)/648))),o=i*4;im2.data[o]=v<.5?0:255*(2*v-1);im2.data[o+1]=v<.5?510*v:255*(2-2*v);im2.data[o+2]=v<.5?255*(1-2*v):0;im2.data[o+3]=v<.25?0:Math.min(220,v*260)}

function analyze(id){const e=exams.find(x=>x.id==id),t0=performance.now(),nx=()=>{if(e.status!='Em análise'){e.status='Em análise';e.ev.push({t:now(),m:'Radiologista iniciou a revisão do exame'})}save();log('Iniciou análise do exame #'+id+' ('+e.patient+')');go('ana',id)};
